<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>whirl room</title>
<meta name="description" content="Click three objects in a haunted room, in any order, and see what the order conjures. A small, forkable experiment." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%83%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <h1 id="title">the haunted room</h1>
  <p class="sub" id="subtitle">Click three objects, in any order. See what haunts you.</p>
</header>

<main id="room" aria-label="room"></main>
<div id="order" aria-live="polite"></div>

<section id="result" aria-live="polite">
  <h2 id="result-title"></h2>
  <p id="result-body"></p>
</section>

<button id="reset" type="button">start over</button>

<footer>a small experiment — fork it, rename it, make it yours</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
